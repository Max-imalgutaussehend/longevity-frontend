name: Frontend CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Notify superprojekt
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "GH_SUBMODULE_TOKEN not configured in repo secrets, skipping dispatch"; exit 0; fi
          gh api repos/Max-imalgutaussehend/LONGEVITY/dispatches \
            --field event_type=submodule-updated \
            --field "client_payload[repo]=frontend"
        env:
          GH_TOKEN: ${{ secrets.GH_SUBMODULE_TOKEN }}
